    <h1>怎麼做出一個用到 LLM 的 OR 系統</h1>
    <p class="sub"><strong>作業研究</strong>（OR）系統是幫人做決策的程式：把排產、配送、選址這類問題寫成數學模型，再算出最好的做法。</p>
    <p class="sub">加入<strong>大型語言模型</strong>（LLM，能讀懂文字、寫出文字的 AI）之後，系統可以自己讀懂文字、寫出模型與程式。</p>
    <p class="meta">教材來源：本專案的 Wiki，整理自來源論文與自製範例</p>
