  <div class="slide-body">
    <h2>第 4 站：錯了就帶著錯誤訊息重寫，但只修得了小錯</h2>
    <ul>
      <li>OptiMUS：LLM 自己產生<strong>單元測試</strong>（一小段自動檢查的程式，自製術語表），把執行錯誤與沒通過的測試交回 LLM 修正</li>
      <li>Chain-of-Experts：<strong>評估器</strong>執行程式與測試案例，它不是 LLM；錯了用<strong>反向反思</strong>，把專家倒過來逐一檢查</li>
      <li>OptiGuide：<strong>Safeguard</strong> 檢查 LLM 產生的程式，觸發自我除錯，或停下來回報錯誤</li>
    </ul>
    <ul class="mt">
      <li>漏掉限制式、語法錯誤修得好；一開始就想錯的模型修不了</li>
      <li>用 <span class="nw">GPT-3.5</span> 時，自動產生的測試常常誤導；多做一兩次改寫或除錯後，效果就不太再提升</li>
    </ul>
  </div>
</section>
