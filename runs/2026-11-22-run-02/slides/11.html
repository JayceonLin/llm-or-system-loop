<section class="slide" data-role="concept" data-wiki="topics/llm-roles.md" data-points="K16">
  <div class="slide-body">
    <h2>LLM 的三種角色：翻譯者、最佳化器、解說員</h2>
    <p class="key">設計系統時，<em class="hi">先決定</em> LLM 要當哪一種角色</p>
    <div class="cols mt">
      <div class="part soft">
        <p><strong>翻譯者</strong>：把文字題變成模型與程式，交給求解器算</p>
        <p class="small">第 1～3 站｜NL4Opt、OptiMUS、<span class="nw">Chain-of-Experts</span></p>
        <p class="small">適合：新問題、要從頭建模</p>
      </div>
      <div class="part soft">
        <p><strong>最佳化器</strong>：不寫模型，自己提出解，看分數再改進</p>
        <p class="small"><em class="hi">不走五站</em>｜OPRO</p>
        <p class="small">適合：只能評分的問題，但大問題有限制</p>
      </div>
      <div class="part soft">
        <p><strong>解說員</strong>：模型已經有了，幫不會寫程式的人問 <span class="nw">what-if</span>，再翻成白話</p>
        <p class="small">第 3～5 站｜OptiGuide</p>
        <p class="small">適合：公司已經有模型</p>
      </div>
    </div>
    <p class="note mt">三種角色都有「試、檢查、再改」的回圈。</p>
    <p class="small">這個分法是本 Wiki 的整理，不是某一篇論文提出的。</p>
  </div>
</section>
