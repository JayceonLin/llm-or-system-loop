<section class="slide" data-role="concept" data-wiki="overview.md" data-points="K01">
  <div class="slide-body">
    <h2>用到 LLM 的 OR 系統可以拆成五站</h2>
    <p class="key">過去寫模型需要專家；加入 LLM 後，系統可以<em class="hi">自己讀懂文字、寫出模型與程式</em>，再交給求解器計算。</p>
    <p class="legend"><span class="llm">LLM 主要負責</span><span class="solver">求解器計算</span></p>
    <div class="stations" role="img" aria-label="五站流程：問題輸入、建模、寫程式交給求解器、驗證與修正、解釋結果與 what-if">
      <div class="llm"><b>問題輸入</b><small>文字題整理成有結構的資料</small></div>
      <div class="llm"><b>建模</b><small>寫出變數、目標、限制式</small></div>
      <div class="solver"><b>寫程式交給求解器</b><small>LLM 寫程式，求解器計算</small></div>
      <div class="llm"><b>驗證與修正</b><small>錯了就帶著錯誤訊息重寫</small></div>
      <div class="llm"><b>解釋結果與 <span class="nw">what-if</span></b><small>翻成白話</small></div>
    </div>
    <p class="note">為什麼需要 LLM：Gurobi 的使用者有 81% 具研究所學歷，寫模型過去是專家的工作。</p>
  </div>
</section>
