<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>怎麼做出一個用到 LLM 的 OR 系統：教學簡報</title>
<meta name="description" content="給完全新手的教學簡報：一個用到 LLM 的作業研究系統，從問題輸入、建模、求解、驗證到解釋結果的五站。內容全部取自本專案的 LLM Wiki。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root {
  --frame: #27313c;
  --paper: #fbfcfd;
  --ink: #1d2733;
  --muted: #55616e;
  --line: #d3dae2;
  --soft: #eef2f6;
  --translate: #2457b8;
  --optimize: #8f5500;
  --explain: #17704f;
  --hl-var: #d9e6ff;
  --hl-obj: #ffe2a3;
  --hl-con: #cdeedd;
  --serif: "Noto Serif TC", "Noto Serif CJK TC", "Songti TC", serif;
  --sans: "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--frame); color: var(--ink); font-family: var(--sans); }
a { color: var(--translate); }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }

/* ---------- 投影片舞台：固定 1280×720，依視窗縮放 ---------- */
.deck {
  position: absolute; left: 50%; top: 50%;
  width: 1280px; height: 720px; margin: -360px 0 0 -640px;
  background: var(--paper); overflow: hidden;
  transform-origin: 50% 50%;
}
.rail {
  position: absolute; top: 0; left: 0; right: 0; height: 40px;
  display: flex; gap: 6px; padding: 14px 80px 0; margin: 0; list-style: none;
}
.rail li { flex: 1; font-size: 13px; color: var(--muted); border-top: 3px solid var(--line); padding-top: 4px; }
.rail li.done { border-top-color: #9fb0c3; }
.rail li.now { border-top-color: var(--ink); color: var(--ink); font-weight: 700; }

.slide { position: absolute; inset: 0; display: none; }
.slide.active { display: block; }
.slide-body {
  position: absolute; top: 66px; left: 80px; right: 80px; bottom: 64px;
  overflow: hidden; font-size: 25px; line-height: 1.55;
}
.slide-src {
  position: absolute; left: 80px; right: 300px; bottom: 16px; white-space: nowrap; overflow: hidden;
  font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px;
}
.slide-src a { margin-right: 10px; color: var(--muted); white-space: nowrap; }

h1, h2, h3 { font-family: var(--serif); margin: 0; letter-spacing: 0.01em; }
h1 { font-size: 76px; line-height: 1.15; font-weight: 900; }
h2 { font-size: 40px; line-height: 1.3; font-weight: 900; margin-bottom: 18px; }
h3 { font-size: 25px; font-weight: 600; margin-bottom: 6px; }
p { margin: 0 0 14px; }
ul, ol { margin: 0 0 14px; padding-left: 1.3em; }
li { margin-bottom: 8px; }
.lead { font-size: 27px; color: var(--ink); max-width: 30em; }
.note { font-size: 21px; color: var(--muted); }
.small { font-size: 19px; color: var(--muted); }

/* 螢光筆：決策變數、目標、限制式各一種顏色，整份簡報固定 */
mark { padding: 0 0.15em; border-radius: 3px; color: inherit; white-space: nowrap; }
.nw { white-space: nowrap; }
.var { background: var(--hl-var); }
.obj { background: var(--hl-obj); }
.con { background: var(--hl-con); }

/* 封面 */
.cover h1 { margin-top: 36px; }
.cover .sub { font-size: 33px; color: var(--muted); margin: 16px 0 44px; }
.translate { display: grid; grid-template-columns: 1fr 64px 1fr; align-items: center; gap: 18px; }
.translate .src { font-size: 25px; line-height: 1.9; margin: 0; padding: 18px 22px; border: 1px solid var(--line); background: #fff; }
.translate .arrow { text-align: center; font-size: 15px; color: var(--muted); line-height: 1.3; }
.translate .arrow b { display: block; font-size: 34px; color: var(--ink); }
.math { font-family: var(--mono); font-size: 25px; line-height: 2; margin: 0; }
.math span { padding: 2px 6px; border-radius: 3px; }
.cover .meta { position: absolute; bottom: 0; left: 0; font-size: 21px; color: var(--muted); margin: 0; }

/* 三欄 */
.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.cols.two { grid-template-columns: repeat(2, 1fr); }
.part { padding: 16px 18px; border-radius: 4px; }
.part p { margin: 0; }
.part .eg { font-size: 20px; color: var(--muted); margin-top: 8px; }

/* 流程 */
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 40px; margin: 18px 0 22px; padding: 0; list-style: none; }
.flow li { position: relative; margin: 0; padding: 8px 14px; border: 1.5px solid var(--ink); border-radius: 4px; font-size: 21px; background: #fff; }
.flow li:not(:last-child)::after { content: "→"; position: absolute; right: -30px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.flow li.solver { background: var(--ink); color: #fff; }

/* 角色 */
.role { border-top: 6px solid; padding: 16px 4px 0; }
.role.t { border-color: var(--translate); }
.role.o { border-color: var(--optimize); }
.role.e { border-color: var(--explain); }
.role h3 { font-size: 28px; }
.role.t h3 { color: var(--translate); }
.role.o h3 { color: var(--optimize); }
.role.e h3 { color: var(--explain); }
.role .who { font-size: 19px; color: var(--muted); margin-top: 10px; }
.tag { display: inline-block; font-size: 17px; font-family: var(--sans); font-weight: 700; padding: 2px 10px; border-radius: 3px; color: #fff; vertical-align: middle; margin-right: 10px; }
.tag.t { background: var(--translate); }
.tag.o { background: var(--optimize); }
.tag.e { background: var(--explain); }

/* 數字 */
.stat { font-family: var(--serif); font-size: 88px; font-weight: 900; line-height: 1; }
.stat-label { font-size: 21px; color: var(--muted); margin-top: 8px; }
.split { display: grid; grid-template-columns: 340px 1fr; gap: 48px; align-items: start; }

/* 步驟 */
.steps { list-style: none; padding: 0; counter-reset: s; }
.steps li { counter-increment: s; position: relative; padding-left: 52px; margin-bottom: 12px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 2px; width: 36px; height: 36px; border-radius: 50%; background: var(--translate); color: #fff; font-weight: 700; text-align: center; line-height: 36px; font-size: 20px; }

/* 表格 */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 20px; }
th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 700; border-bottom: 2px solid var(--ink); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* 程式碼與模型 */
pre { margin: 0; padding: 16px 20px; background: var(--soft); font-family: var(--mono); font-size: 17px; line-height: 1.5; overflow-x: auto; border-radius: 4px; }
.model { font-family: var(--mono); font-size: 21px; line-height: 1.8; padding: 14px 20px; background: #fff; border: 1px solid var(--line); }
.problem { font-size: 21px; line-height: 1.7; padding: 16px 20px; background: #fff; border-left: 5px solid var(--ink); }

/* 測驗 */
details { border: 1.5px solid var(--line); border-radius: 4px; padding: 12px 18px; margin-bottom: 12px; background: #fff; }
details[open] { border-color: var(--ink); }
summary { cursor: pointer; font-weight: 500; }
details p { margin: 10px 0 0; color: var(--explain); }

.mt { margin-top: 16px; }
.caption { font-size: 19px; color: var(--muted); margin: 0 0 6px; }
.soft { background: var(--soft); }
.answer { font-weight: 700; border-left: 5px solid var(--explain); padding-left: 14px; }
.refs { font-size: 19px; line-height: 1.45; }
.refs li { margin-bottom: 10px; }

/* 操作列 */
.nav { position: absolute; right: 80px; bottom: 12px; display: flex; gap: 8px; align-items: center; z-index: 5; }
.nav button { font: inherit; font-size: 16px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); color: var(--ink); cursor: pointer; }
.nav button:hover { border-color: var(--ink); }
.nav button:disabled { color: var(--muted); border-color: var(--soft); cursor: default; }
.nav .count { color: var(--muted); font-size: 16px; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }


/* ---------- run-02：重點與圖例 ---------- */
:root { --hi: #ffe58a; --key: #b88a00; --llm-soft: #e4ecfb; --check: #17704f; --check-soft: #ddf1e8; }
/* 重點句：一張最多一個，放這張最該記住的一句 */
.key { position: relative; margin: 0 0 16px; padding: 12px 18px 12px 92px; background: #fff8dc; border-left: 6px solid var(--key); font-weight: 700; font-size: 25px; line-height: 1.45; }
.key::before { content: "重點"; position: absolute; left: 18px; top: 13px; font-size: 17px; font-weight: 700; color: #fff; background: var(--key); padding: 1px 9px; border-radius: 3px; line-height: 1.5; }
/* 重點螢光：一張最多兩處，只標關鍵短語；術語仍用 strong */
.hi { white-space: nowrap; font-style: normal; font-weight: 700; background: linear-gradient(transparent 58%, var(--hi) 58%); padding: 0 2px; }
/* 五站地圖：.here 是這一張講的站 */
.map { display: flex; gap: 0; margin: 0 0 16px; padding: 0; counter-reset: st; }
.map span { counter-increment: st; flex: 1; position: relative; font-size: 16px; color: var(--muted); padding: 6px 8px 6px 36px; border-top: 4px solid var(--line); white-space: nowrap; }
.map span::before { content: counter(st); position: absolute; left: 6px; top: 7px; width: 22px; height: 22px; border-radius: 50%; background: var(--line); color: #fff; font-weight: 700; font-size: 14px; line-height: 22px; text-align: center; }
.map span.here { color: var(--ink); font-weight: 700; border-top-color: var(--translate); }
.map span.here::before { background: var(--translate); }
.map span.done { border-top-color: #9fb0c3; }
/* 大五站圖 */
.stations { display: grid; grid-template-columns: repeat(5, 1fr); gap: 34px; margin: 10px 0 18px; counter-reset: st; }
.stations > div { counter-increment: st; position: relative; padding: 46px 12px 14px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; text-align: center; font-size: 21px; line-height: 1.35; }
.stations > div::before { content: counter(st); position: absolute; left: 50%; top: -20px; margin-left: -20px; width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff; font: 900 22px/40px var(--serif); }
.stations > div:not(:last-child)::after { content: "→"; position: absolute; right: -29px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 22px; }
.stations > div b { display: block; font-family: var(--serif); font-size: 23px; margin-bottom: 4px; }
.stations > div small { display: block; font-size: 16px; color: var(--muted); }
/* 誰負責：流程圖與五站圖的節點顏色，搭配 .legend */
.flow li.llm, .stations > div.llm { border-color: var(--translate); background: var(--llm-soft); }
.flow li.check, .stations > div.check { border-color: var(--check); background: var(--check-soft); }
.flow li.person, .stations > div.person { border-style: dashed; }
.stations > div.solver { background: var(--ink); color: #fff; }
.stations > div.solver small { color: #d6dde6; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 17px; color: var(--muted); margin: 0 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend span::before { content: ""; width: 22px; height: 16px; border: 2px solid var(--ink); border-radius: 3px; background: #fff; }
.legend .llm::before { border-color: var(--translate); background: var(--llm-soft); }
.legend .solver::before { background: var(--ink); }
.legend .check::before { border-color: var(--check); background: var(--check-soft); }
.legend .person::before { border-style: dashed; }
/* 回圈：在流程下方畫一條回到第一步的線 */
.flow.loop { padding-bottom: 34px; position: relative; }
.flow.loop::before { content: ""; position: absolute; left: 24px; right: 24px; bottom: 10px; height: 22px; border: 2px dashed var(--muted); border-top: 0; border-radius: 0 0 8px 8px; }
.flow.loop::after { content: "回到第一步"; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); padding: 0 10px; background: var(--paper); font-size: 15px; line-height: 20px; color: var(--muted); }
.stations > div.solver::before { background: #fff; color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
/* 長條圖：class v0～v100 決定長度，數值寫在 <b> */
.bars { margin: 6px 0 14px; }
.bar { display: grid; grid-template-columns: 360px 1fr 150px; align-items: center; gap: 14px; margin: 0 0 8px; font-size: 20px; line-height: 1.3; }
.bar i { display: block; height: 22px; background: var(--soft); border-radius: 3px; position: relative; }
.bar i::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--v) * 1%); background: #9fb0c3; border-radius: 3px; }
.bar.best i::after { background: var(--translate); }
.bar b { font-variant-numeric: tabular-nums; }
.v0{--v:0}.v1{--v:1}.v2{--v:2}.v3{--v:3}.v4{--v:4}.v5{--v:5}.v6{--v:6}.v7{--v:7}.v8{--v:8}.v9{--v:9}.v10{--v:10}.v11{--v:11}.v12{--v:12}.v13{--v:13}.v14{--v:14}.v15{--v:15}.v16{--v:16}.v17{--v:17}.v18{--v:18}.v19{--v:19}.v20{--v:20}.v21{--v:21}.v22{--v:22}.v23{--v:23}.v24{--v:24}.v25{--v:25}.v26{--v:26}.v27{--v:27}.v28{--v:28}.v29{--v:29}.v30{--v:30}.v31{--v:31}.v32{--v:32}.v33{--v:33}.v34{--v:34}.v35{--v:35}.v36{--v:36}.v37{--v:37}.v38{--v:38}.v39{--v:39}.v40{--v:40}.v41{--v:41}.v42{--v:42}.v43{--v:43}.v44{--v:44}.v45{--v:45}.v46{--v:46}.v47{--v:47}.v48{--v:48}.v49{--v:49}.v50{--v:50}.v51{--v:51}.v52{--v:52}.v53{--v:53}.v54{--v:54}.v55{--v:55}.v56{--v:56}.v57{--v:57}.v58{--v:58}.v59{--v:59}.v60{--v:60}.v61{--v:61}.v62{--v:62}.v63{--v:63}.v64{--v:64}.v65{--v:65}.v66{--v:66}.v67{--v:67}.v68{--v:68}.v69{--v:69}.v70{--v:70}.v71{--v:71}.v72{--v:72}.v73{--v:73}.v74{--v:74}.v75{--v:75}.v76{--v:76}.v77{--v:77}.v78{--v:78}.v79{--v:79}.v80{--v:80}.v81{--v:81}.v82{--v:82}.v83{--v:83}.v84{--v:84}.v85{--v:85}.v86{--v:86}.v87{--v:87}.v88{--v:88}.v89{--v:89}.v90{--v:90}.v91{--v:91}.v92{--v:92}.v93{--v:93}.v94{--v:94}.v95{--v:95}.v96{--v:96}.v97{--v:97}.v98{--v:98}.v99{--v:99}.v100{--v:100}
/* ---------- 手機：改成由上往下閱讀 ---------- */
@media (max-width: 760px) {
  body { background: var(--paper); }
  .deck { position: static; width: auto; height: auto; margin: 0; transform: none !important; overflow: visible; }
  .rail, .nav { display: none; }
  .slide { position: static; display: block; padding: 28px 18px 18px; border-bottom: 8px solid var(--soft); }
  .slide-body { position: static; overflow: visible; font-size: 17px; }
  .slide-src { position: static; margin-top: 14px; font-size: 13px; white-space: normal; }
  mark { white-space: normal; }
  .refs { font-size: 15px; }
  h1 { font-size: 38px; }
  h2 { font-size: 25px; margin-bottom: 14px; }
  h3 { font-size: 19px; }
  .lead { font-size: 18px; }
  .note, .small, .stat-label, .role .who, .part .eg { font-size: 15px; }
  .cover h1 { margin-top: 0; }
  .cover .sub { font-size: 19px; margin-bottom: 20px; }
  .cover .meta { position: static; margin-top: 16px; font-size: 14px; }
  .translate { grid-template-columns: 1fr; }
  .translate .src, .math, .model, .problem { font-size: 16px; }
  .translate .arrow b { display: inline; font-size: 22px; }
  .cols, .cols.two, .split { grid-template-columns: 1fr; gap: 14px; }
  .stat { font-size: 54px; }
  .role h3 { font-size: 21px; }
  .flow li { font-size: 15px; padding: 6px 10px; }
  /* run-02：手機上流程圖改成由上往下，箭頭朝下，不會指向空白 */
  .flow { flex-direction: column; align-items: flex-start; gap: 22px; }
  .flow li:not(:last-child)::after { content: "↓"; right: auto; left: 16px; top: auto; bottom: -21px; transform: none; font-size: 14px; }
  table { font-size: 14px; }
  table.wide { min-width: 560px; }
  .table-wrap:has(table.wide)::after { content: "← 表格可以左右滑動 →"; display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  table.wide td:not(:last-child), table.wide th:not(:last-child) { white-space: nowrap; }
  th, td { padding: 6px 8px; }
  pre { font-size: 13px; }
  .steps li { padding-left: 44px; }
  .steps li::before { width: 30px; height: 30px; line-height: 30px; font-size: 16px; }
  .key { font-size: 17px; padding: 10px 12px 10px 62px; }
  .key::before { font-size: 13px; left: 10px; top: 11px; padding: 0 6px; }
  .map { flex-wrap: wrap; }
  .map span { flex: 0 0 auto; font-size: 12px; padding: 4px 6px 4px 26px; }
  .map span::before { width: 17px; height: 17px; line-height: 17px; font-size: 11px; left: 4px; top: 5px; }
  .stations { grid-template-columns: 1fr; gap: 12px; }
  .stations > div { padding: 10px 12px 10px 54px; text-align: left; font-size: 15px; }
  .stations > div::before { text-align: center; left: 12px; top: 50%; margin: -15px 0 0; width: 30px; height: 30px; font-size: 16px; line-height: 30px; }
  .caption { font-size: 13px; }
  .stations > div:not(:last-child)::after { content: "↓"; right: auto; left: 20px; top: auto; bottom: -18px; transform: none; font-size: 15px; }
  .stations > div b { font-size: 16px; }
  .stations > div small, .legend { font-size: 13px; }
  .bar { grid-template-columns: 1fr 64px; gap: 4px 8px; font-size: 14px; }
  .bar span { grid-column: 1 / -1; }
  .bar i { height: 14px; }
  .flow.loop { padding-bottom: 0; }
  .flow.loop::before { display: none; }
  .flow.loop::after { content: "↺ 做完最後一步，回到第一步"; position: static; transform: none; padding: 0; font-size: 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  details[open] p { animation: show 0.25s ease-out; }
  @keyframes show { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<main class="deck" id="deck" aria-roledescription="簡報">
<ol class="rail" id="rail" aria-hidden="true"></ol>

<!-- SLIDES -->
<div class="nav" data-ui role="group" aria-label="切換投影片（也可以用鍵盤的左右鍵）">
  <button type="button" id="prev" aria-label="上一張" aria-keyshortcuts="ArrowLeft">‹ 上一張</button>
  <span class="count" id="count" aria-live="polite"></span>
  <button type="button" id="next" aria-label="下一張" aria-keyshortcuts="ArrowRight">下一張 ›</button>
</div>
</main>

<script>
(function () {
  var deck = document.getElementById("deck");
  var slides = Array.prototype.slice.call(document.querySelectorAll("section.slide"));
  var rail = document.getElementById("rail");
  var count = document.getElementById("count");
  var prev = document.getElementById("prev");
  var next = document.getElementById("next");
  var reading = window.matchMedia("(max-width: 760px)");
  var SECTIONS = [
    ["開場", ["cover", "goals"]], ["先備知識", ["prereq"]], ["概念", ["concept"]],
    ["例子", ["example"]], ["比較", ["compare"]], ["注意", ["pitfall"]],
    ["測驗", ["quiz"]], ["總結", ["summary", "refs"]]
  ];
  var current = 0;

  SECTIONS.forEach(function (s) {
    var li = document.createElement("li");
    li.textContent = s[0];
    rail.appendChild(li);
  });

  function sectionOf(role) {
    for (var k = 0; k < SECTIONS.length; k++) if (SECTIONS[k][1].indexOf(role) >= 0) return k;
    return 0;
  }

  function fit() {
    if (reading.matches) { deck.style.transform = ""; return; }
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    deck.style.transform = "scale(" + s + ")";
  }

  function go(i) {
    current = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach(function (el, k) {
      el.classList.toggle("active", k === current);
      el.setAttribute("aria-hidden", reading.matches || k === current ? "false" : "true");
    });
    var sec = sectionOf(slides[current].getAttribute("data-role"));
    Array.prototype.forEach.call(rail.children, function (li, k) {
      li.className = k < sec ? "done" : k === sec ? "now" : "";
    });
    count.textContent = (current + 1) + " / " + slides.length;
    prev.disabled = current === 0;
    next.disabled = current === slides.length - 1;
    if (history.replaceState) history.replaceState(null, "", "#" + (current + 1));
    if (reading.matches) slides[current].scrollIntoView();
  }

  prev.addEventListener("click", function () { go(current - 1); });
  next.addEventListener("click", function () { go(current + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "SUMMARY") { if (e.key === " " || e.key === "Enter") return; }
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(current + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(current - 1); }
    else if (e.key === "Home") { go(0); }
    else if (e.key === "End") { go(slides.length - 1); }
  });
  window.addEventListener("resize", fit);
  window.addEventListener("hashchange", function () {
    var k = parseInt((location.hash || "").slice(1), 10);
    if (!isNaN(k) && k - 1 !== current) go(k - 1);
  });
  reading.addEventListener ? reading.addEventListener("change", function () { fit(); go(current); }) : null;

  var start = parseInt((location.hash || "").slice(1), 10);
  fit();
  go(isNaN(start) ? 0 : start - 1);
  window.deck = { go: go, count: slides.length };
})();
</script>
</body>
</html>
